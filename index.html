            ] },
            { id: 72, title: 'Пицца Маргарита', category: 'food', time: '40 минут', image: 'https://avatars.mds.yandex.net/i?id=c528302c96818efa83eaf54f47e9a3a552d1d7bb-9048286-images-thumbs&n=13', ingredients: ['Тесто для пиццы — 250 г', 'Томатный соус — 100 мл', 'Моцарелла — 125 г (свежая, шарик)', 'Базилик свежий — несколько листьев', 'Оливковое масло'], steps: [
                'ШАГ 1: ТЕСТО. Достаньте тесто из холодильника за 30 минут до готовки. Разогрейте духовку до максимума (250°C), если есть камень для пиццы — поставьте его греться.',
                'ШАГ 2: ФОРМОВКА. На посыпанном мукой столе растяните тесто руками в круг толщиной 3-5 мм. Не раскатывайте скалкой, чтобы не выгнать пузырьки воздуха.',
                'ШАГ 3: СОУС. Смажьте основу томатным соусом, оставляя края свободными. Соус не должен быть толстым слоем.',
                'ШАГ 4: СЫР. Порвите моцареллу руками на кусочки и разложите по пицце. Сбрызните оливковым маслом.',
                'ШАГ 5: ВЫПЕКАНИЕ. Переложите пиццу на противень или камень. Выпекайте 10-15 минут до золотистых краев. Готовую пиццу посыпьте свежим базиликом.'
            ] },
            { id: 73, title: 'Цезарь с курицей', category: 'food', time: '20 минут', image: 'https://avatars.mds.yandex.net/i?id=c272063d13543cc44ba565ddb09ad8d832ea51f0-5548614-images-thumbs&n=13', ingredients: ['Куриное филе — 200 г', 'Салат Романо — 1 кочан', 'Пармезан — 50 г', 'Белый хлеб — 2 куска', 'Соус Цезарь — 100 мл'], steps: [
                'ШАГ 1: КУРИЦА. Куриное филе посолите, поперчите. Обжарьте на сковороде с маслом по 5 минут с каждой стороны. Накройте фольгой и дайте отдохнуть.',
                'ШАГ 2: СУХАРИКИ. Хлеб нарежьте кубиками. Подсушите на сухой сковороде или в духовке до золота.',
                'ШАГ 3: САЛАТ. Листья салата вымойте, обсушите. Порвите руками на крупные куски.',
                'ШАГ 4: СБОРКА. В миску положите салат, полейте частью соуса, перемешайте. Выложите на тарелку.',
                'ШАГ 5: ФИНАЛ. Сверху положите нарезанную курицу, посыпьте сухариками и стружкой пармезана. Полейте оставшимся соусом.'
            ] },
            { id: 74, title: 'Бургер с говядиной', category: 'food', time: '30 минут', image: 'https://avatars.mds.yandex.net/i?id=8fec59103262393d38db95ebdd4474ae8b813f9b-8272935-images-thumbs&n=13', ingredients: ['Булочка для бургера', 'Говяжий фарш — 200 г (20% жирности)', 'Сыр чеддер — 1 ломтик', 'Помидор — 2 кружка', 'Салат айсберг', 'Красный лук', 'Соус (кетчуп+майонез+горчица)'], steps: [
                'ШАГ 1: КОТЛЕТА. Из фарша сформируйте котлету толщиной 2 см, диаметром чуть больше булочки. Посолите, поперчите только перед жаркой. Сделайте ямочку пальцем в центре — чтобы котлета не вздулась.',
                'ШАГ 2: ЖАРКА. Разогрейте сковороду-гриль или обычную. Жарьте котлету 3 минуты с одной стороны, переверните, положите сверху сыр и жарьте еще 3 минуты.',
                'ШАГ 3: БУЛОЧКА. Разрежьте булочку, срезы поджарьте на той же сковороде.',
                'ШАГ 4: СБОРКА. На нижнюю булочку намажьте соус, положите салат, котлету с сыром, помидор, лук. Накройте верхней булочкой.',
                'ШАГ 5: ПОДАЧА. Дайте постоять 2 минуты, чтобы вкусы смешались. Подавайте с картошкой фри.'
            ] },
            { id: 75, title: 'Греческий салат', category: 'food', time: '15 минут', image: 'https://avatars.mds.yandex.net/i?id=d908f05a261b9ace3f36c019b1a5d47a423edd95-17022023-images-thumbs&n=13', ingredients: ['Помидоры — 2 шт', 'Огурец — 1 шт', 'Перец болгарский — 1 шт', 'Красный лук — 0.5 шт', 'Фета — 150 г', 'Маслины — 100 г', 'Оливковое масло', 'Орегано сушеный'], steps: [
                'ШАГ 1: ОВОЩИ. Помидоры нарежьте крупными дольками. Огурец — крупными полукругами. Перец — кусками. Лук — тонкими полукольцами.',
                'ШАГ 2: СЫР. Фету нарежьте крупными кубиками 2х2 см.',
                'ШАГ 3: ЗАПРАВКА. В отдельной миске смешайте оливковое масло, соль, перец, орегано.',
                'ШАГ 4: СМЕШИВАНИЕ. В глубокой тарелке смешайте овощи, маслины и фету. Полейте заправкой.',
                'ШАГ 5: ПОДАЧА. Греческий салат не перемешивают сильно, чтобы не раздавить фету. Подают сразу.'
            ] },
            { id: 76, title: 'Куриный суп с лапшой', category: 'food', time: '45 минут', image: 'https://avatars.mds.yandex.net/i?id=cbc52a0f88fd7bb91e04a40977b4697a49c1f1ca-5161119-images-thumbs&n=13', ingredients: ['Курица (голень/бедро) — 300 г', 'Картофель — 2 шт', 'Морковь — 1 шт', 'Лук — 1 шт', 'Лапша — 50 г', 'Зелень'], steps: [
                'ШАГ 1: БУЛЬОН. Курицу залейте холодной водой (2 л), доведите до кипения, снимите пену. Убавьте огонь, варите 30 минут.',
                'ШАГ 2: ОВОЩИ. Картофель нарежьте кубиками. Морковь натрите на крупной терке. Лук мелко нарежьте.',
                'ШАГ 3: ЗАКЛАДКА. Через 30 минут достаньте курицу, мясо отделите от костей, верните в бульон. Добавьте картофель, варите 10 минут.',
                'ШАГ 4: ЗАЖАРКА. Обжарьте лук с морковью на масле до мягкости. Добавьте в суп.',
                'ШАГ 5: ЛАПША. Положите лапшу, варите 5-7 минут. Посолите, поперчите, добавьте зелень. Выключите, дайте настояться 10 минут.'
            ] },
            { id: 77, title: 'Омлет с овощами', category: 'food', time: '15 минут', image: 'https://avatars.mds.yandex.net/i?id=6e7f18e223812b22a7f2e5f678e3ecd6790f60c6-4220247-images-thumbs&n=13', ingredients: ['Яйца — 3 шт', 'Молоко — 50 мл', 'Помидор — 1 шт', 'Перец болгарский — 0.5 шт', 'Сыр — 30 г'], steps: [
                'ШАГ 1: ОВОЩИ. Помидор нарежьте кубиками, перец — тонкими полосками. Обжарьте на сковороде с маслом 2 минуты.',
                'ШАГ 2: ЯЙЦА. В миске взбейте яйца с молоком, солью и перцем до однородности.',
                'ШАГ 3: ЗАЛИВКА. Залейте овощи яичной смесью. Убавьте огонь до среднего.',
                'ШАГ 4: СЫР. Посыпьте тертым сыром. Накройте крышкой.',
                'ШАГ 5: ГОТОВНОСТЬ. Готовьте 5-7 минут, пока омлет не схватится. Подавайте горячим.'
            ] },
            { id: 78, title: 'Запеченный лосось', category: 'food', time: '25 минут', image: 'https://avatars.mds.yandex.net/i?id=77d69c385fdd29a9bc52633dbf230c2eb90e41c5-11485721-images-thumbs&n=13', ingredients: ['Филе лосося — 400 г', 'Лимон — 0.5 шт', 'Укроп', 'Оливковое масло', 'Соль, перец'], steps: [
                'ШАГ 1: РЫБА. Филе лосося обсушите бумажным полотенцем. Посолите, поперчите с обеих сторон.',
                'ШАГ 2: МАРИНОВКА. Сбрызните лимонным соком и оливковым маслом. Посыпьте рубленым укропом.',
                'ШАГ 3: ФОЛЬГА. Заверните лосось в фольгу конвертом, оставив немного воздуха внутри.',
                'ШАГ 4: ЗАПЕКАНИЕ. Разогрейте духовку до 180°C. Запекайте 20 минут.',
                'ШАГ 5: ПОДАЧА. Разверните фольгу, подавайте с долькой лимона.'
            ] },
            { id: 79, title: 'Шакшука', category: 'food', time: '30 минут', image: 'https://avatars.mds.yandex.net/i?id=27cf4a86ae4a38d074cf0ad3a6d2cca5a1e0605f-8179254-images-thumbs&n=13', ingredients: ['Яйца — 4 шт', 'Помидоры — 4 шт', 'Перец болгарский — 1 шт', 'Лук — 1 шт', 'Чеснок — 2 зубчика', 'Томатная паста — 1 ст.л.', 'Паприка, кумин'], steps: [
                'ШАГ 1: СОУС. На сковороде обжарьте лук и чеснок до прозрачности. Добавьте нарезанный перец, жарьте 3 минуты.',
                'ШАГ 2: ПОМИДОРЫ. Помидоры натрите на терке или измельчите блендером. Добавьте в сковороду с томатной пастой и специями (паприка, кумин, соль, перец). Тушите 10 минут, пока соус не загустеет.',
                'ШАГ 3: ЯЙЦА. Ложкой сделайте в соусе углубления. Вбейте в них яйца.',
                'ШАГ 4: ДОВАРИВАНИЕ. Накройте крышкой, готовьте 5-7 минут до желаемой степени готовности желтка.',
                'ШАГ 5: ПОДАЧА. Посыпьте зеленью, подавайте с хлебом.'
            ] },
            { id: 80, title: 'Котлеты по-киевски', category: 'food', time: '50 минут', image: 'https://avatars.mds.yandex.net/i?id=8b9a834af02e366fc2c7067767291823378ac9ae-5876836-images-thumbs&n=13', ingredients: ['Куриное филе — 2 шт', 'Масло сливочное — 80 г', 'Яйца — 2 шт', 'Панировочные сухари', 'Укроп', 'Чеснок'], steps: [
                'ШАГ 1: МАСЛО. Сливочное масло размягчите, смешайте с рубленым укропом и измельченным чесноком. Сформируйте брусочки, уберите в морозилку.',
                'ШАГ 2: ФИЛЕ. Куриное филе отбейте в тонкий пласт, посолите, поперчите.',
                'ШАГ 3: ФОРМОВКА. На середину филе положите брусочек замороженного масла. Заверните конвертом, полностью закрыв масло внутри.',
                'ШАГ 4: ПАНИРОВКА. Обваляйте котлету в муке, затем во взбитом яйце, затем в сухарях. Повторите яйцо-сухари для двойной панировки.',
                'ШАГ 5: ЖАРКА. Разогрейте масло во фритюрнице или глубокой сковороде. Жарьте котлеты 5-7 минут до золота. Затем доведите в духовке 10 минут при 180°C, чтобы масло внутри растопилось.'
            ] },
            { id: 81, title: 'Борщ украинский', category: 'food', time: '90 минут', image: 'https://avatars.mds.yandex.net/i?id=0a13a6df7c9ef3f1eb768907d430a998da8f06d9-4936279-images-thumbs&n=13', ingredients: ['Свекла — 2 шт', 'Капуста — 300 г', 'Картофель — 3 шт', 'Морковь — 1 шт', 'Лук — 1 шт', 'Томатная паста — 2 ст.л.', 'Мясо (говядина) — 400 г'], steps: [
                'ШАГ 1: БУЛЬОН. Мясо залейте водой (3 л), варите 1 час, снимая пену. Посолите в конце.',
                'ШАГ 2: СВЕКЛА. Свеклу натрите, обжарьте на масле с добавлением уксуса и томатной пасты 10 минут.',
                'ШАГ 3: ЗАЖАРКА. Лук и морковь обжарьте отдельно.',
                'ШАГ 4: СБОРКА. В бульон положите нарезанный картофель, через 10 минут — капусту. Еще через 10 минут добавьте свеклу и зажарку.',
                'ШАГ 5: НАСТАИВАНИЕ. Варите еще 10 минут. Выключите, добавьте чеснок и зелень. Дайте настояться минимум 30 минут.'
            ] },
            { id: 82, title: 'Плов узбекский', category: 'food', time: '80 минут', image: 'https://avatars.mds.yandex.net/i?id=c9372111c0198067b32b83fe20d7b428d889734c-10878270-images-thumbs&n=13', ingredients: ['Рис — 400 г (лучше девзира)', 'Баранина или говядина — 500 г', 'Морковь — 400 г', 'Лук — 200 г', 'Чеснок — 1 головка', 'Масло растительное', 'Зира, барбарис'], steps: [
                'ШАГ 1: ПОДГОТОВКА. Мясо нарежьте кусками. Лук полукольцами, морковь соломкой. Разогрейте масло в казане до легкого дымка.',
                'ШАГ 2: ЗИРВАК. Обжарьте лук до золота, добавьте мясо, жарьте до корочки. Добавьте морковь, жарьте 5 минут. Залейте кипятком, добавьте зиру, барбарис, соль. Варите 30 минут.',
                'ШАГ 3: ЧЕСНОК. Воткните в мясо головку чеснока (очищенную от верхней шелухи).',
                'ШАГ 4: РИС. Засыпьте рис, разровняйте. Залейте кипятком на 1 см выше риса. Варите, пока вода не впитается, соберите рис горкой, сделайте палочкой отверстия до дна.',
                'ШАГ 5: УПАРИВАНИЕ. Убавьте огонь до минимума, накройте крышкой, томите 20 минут. Перемешайте перед подачей.'
            ] },
            { id: 83, title: 'Лазанья', category: 'food', time: '60 минут', image: 'https://avatars.mds.yandex.net/i?id=fd79ca0d2a5be00f416cc05006d1f01f1c1ea402-5747098-images-thumbs&n=13', ingredients: ['Листы лазаньи — 9 шт', 'Фарш мясной — 500 г', 'Лук — 1 шт', 'Томатный соус — 400 г', 'Молоко — 500 мл', 'Масло сливочное — 50 г', 'Мука — 50 г', 'Сыр — 200 г'], steps: [
                'ШАГ 1: БОЛОНЬЕЗ. Обжарьте лук и фарш. Добавьте томатный соус, тушите 20 минут.',
                'ШАГ 2: БЕШАМЕЛЬ. Растопите масло, добавьте муку, обжаривайте 1 минуту. Постепенно влейте молоко, постоянно мешая, варите до загустения. Посолите, добавьте мускат.',
                'ШАГ 3: СБОРКА. На дно формы налейте немного бешамеля. Выложите листы, затем мясной соус, бешамель, сыр. Повторите слои. Верхний слой — бешамель и много сыра.',
                'ШАГ 4: ЗАПЕКАНИЕ. Накройте фольгой, запекайте 30 минут при 180°C. Снимите фольгу, запекайте еще 10 минут.',
                'ШАГ 5: ОТДЫХ. Дайте лазанье постоять 10 минут перед нарезкой.'
            ] },
            { id: 84, title: 'Стейк Рибай', category: 'food', time: '20 минут', image: 'https://avatars.mds.yandex.net/i?id=5250a221122efb0562c2c1e39d2302ec26cb3b65-5655335-images-thumbs&n=13', ingredients: ['Стейк рибай — 500 г (толщина 3-4 см)', 'Масло растительное', 'Чеснок — 3 зубчика', 'Тимьян', 'Масло сливочное'], steps: [
                'ШАГ 1: ПОДГОТОВКА. Достаньте мясо из холодильника за час до готовки, чтобы оно согрелось до комнатной температуры. Обсушите бумажным полотенцем. Посолите, поперчите прямо перед жаркой.',
                'ШАГ 2: СКОВОРОДА. Разогрейте сковороду (лучше чугунную) до максимума. Налейте масло с высокой температурой дымообразования.',
                'ШАГ 3: ЖАРКА. Положите стейк, жарьте 2-3 минуты до золотой корочки. Переверните, жарьте еще 2 минуты.',
                'ШАГ 4: АРОМАТ. Убавьте огонь, добавьте сливочное масло, чеснок и тимьян. Поливайте стейк маслом ложкой 1-2 минуты.',
                'ШАГ 5: ОТДЫХ. Переложите стейк на доску, накройте фольгой, дайте отдохнуть 5-7 минут. Только потом нарезайте.'
            ] },
            { id: 85, title: 'Тирамису', category: 'food', time: '30 минут', image: 'https://avatars.mds.yandex.net/i?id=d1ec4c00ab521d1520dfe09c20bdf4061ee0bf67-5869256-images-thumbs&n=13', ingredients: ['Маскарпоне — 500 г', 'Яйца — 4 шт (свежие)', 'Сахар — 100 г', 'Печенье Савоярди — 200 г', 'Кофе эспрессо — 300 мл', 'Какао'], steps: [
                'ШАГ 1: КОФЕ. Сварите крепкий кофе, остудите до комнатной температуры.',
                'ШАГ 2: КРЕМ. Отделите белки от желтков. Желтки взбейте с сахаром добела. Добавьте маскарпоне, взбейте до однородности. Отдельно взбейте белки в крепкую пену, аккуратно вмешайте в сырную массу.',
                'ШАГ 3: СБОРКА. Быстро обмакните печенье в кофе (не размачивайте) и выложите в форму.',
                'ШАГ 4: СЛОИ. На печенье выложите половину крема. Повторите слой печенья и крема.',
                'ШАГ 5: ОХЛАЖДЕНИЕ. Уберите в холодильник минимум на 4 часа. Перед подачей посыпьте какао через сито.'
            ] },
            { id: 86, title: 'Мотти (корейские рисовые шарики)', category: 'food', time: '20 минут', image: 'https://avatars.mds.yandex.net/i?id=b58070dace5de16a060df561303f47b02114e85e-4080597-images-thumbs&n=13', ingredients: ['Мука рисовая — 200 г', 'Сахар — 50 г', 'Соль — щепотка', 'Вода — 200 мл', 'Сгущенка или сладкая фасоль для начинки'], steps: [
                'ШАГ 1: ТЕСТО. Смешайте рисовую муку, сахар, соль. Постепенно влейте воду, замесите мягкое тесто. Оно должно быть эластичным и не липнуть к рукам.',
                'ШАГ 2: НАЧИНКА. Подготовьте начинку: сгущенное молоко, варенье, сладкая фасоль.',
                'ШАГ 3: ФОРМОВКА. Мокрыми руками сформируйте лепешку, положите начинку, защипните края. Скатайте шарик.',
                'ШАГ 4: ВАРКА. Вскипятите воду. Бросьте шарики, варите 3-5 минут после всплытия.',
                'ШАГ 5: ПОДАЧА. Готовые мотти можно обвалять в кокосовой стружке или кунжуте.'
            ] },
            { id: 87, title: 'Брускетта с томатами', category: 'food', time: '15 минут', image: 'https://avatars.mds.yandex.net/i?id=b84288a9db2e1a8a5eea3eda65e033f7232fa1d3-10148308-images-thumbs&n=13', ingredients: ['Хлеб чиабатта — 4 ломтика', 'Помидоры черри — 200 г', 'Чеснок — 2 зубчика', 'Базилик', 'Оливковое масло'], steps: [
                'ШАГ 1: ТОМАТЫ. Помидоры нарежьте мелким кубиком. Добавьте рубленый базилик, соль, перец, оливковое масло. Перемешайте, дайте настояться.',
                'ШАГ 2: ХЛЕБ. Ломтики хлеба поджарьте на гриле, сухой сковороде или в тостере до хруста.',
                'ШАГ 3: ЧЕСНОК. Горячий хлеб натрите чесноком.',
                'ШАГ 4: НАЧИНКА. Выложите томатную смесь на хлеб.',
                'ШАГ 5: ПОДАЧА. Сразу подавайте, чтобы хлеб не размок.'
            ] },
            { id: 88, title: 'Капрезе', category: 'food', time: '10 минут', image: 'https://avatars.mds.yandex.net/i?id=30e7811b288bdbafc93f4eba8dd4fbedaa2b3f4d-5231989-images-thumbs&n=13', ingredients: ['Моцарелла (шарики) — 250 г', 'Помидоры — 3 шт', 'Базилик', 'Оливковое масло', 'Бальзамический крем'], steps: [
                'ШАГ 1: НАРЕЗКА. Помидоры и моцареллу нарежьте кружками одинаковой толщины.',
                'ШАГ 2: СБОРКА. На тарелке выложите по очереди помидор, моцареллу, лист базилика.',
                'ШАГ 3: ЗАПРАВКА. Посолите, поперчите, полейте оливковым маслом.',
                'ШАГ 4: УКРАШЕНИЕ. Полейте бальзамическим кремом для красоты.',
                'ШАГ 5: ПОДАЧА. Подавайте сразу.'
            ] },
            { id: 89, title: 'Жульен с грибами', category: 'food', time: '35 минут', image: 'https://avatars.mds.yandex.net/i?id=438b1c522fc751e806f850670238332a5e8a1e22-4576585-images-thumbs&n=13', ingredients: ['Шампиньоны — 400 г', 'Лук — 1 шт', 'Сливки 20% — 200 мл', 'Сыр — 100 г', 'Масло', 'Мука — 1 ст.л.'], steps: [
                'ШАГ 1: ГРИБЫ. Лук нарежьте мелко, обжарьте до прозрачности. Грибы нарежьте пластинами, добавьте к луку, жарьте, пока не выпарится вода.',
                'ШАГ 2: СОУС. Посыпьте грибы мукой, перемешайте, обжаривайте 1 минуту. Влейте сливки, варите до загустения. Посолите, поперчите.',
                'ШАГ 3: ФОРМЫ. Разложите грибную массу по кокотницам (маленьким формочкам).',
                'ШАГ 4: СЫР. Посыпьте тертым сыром.',
                'ШАГ 5: ЗАПЕКАНИЕ. Запекайте в духовке при 200°C 10 минут, до золотой корочки.'
            ] },
            { id: 90, title: 'Ленивые голубцы', category: 'food', time: '50 минут', image: 'https://avatars.mds.yandex.net/i?id=430e273b5eca1f411f3dc5e9b2166abd20f7ab01-9148169-images-thumbs&n=13', ingredients: ['Фарш — 500 г', 'Капуста — 400 г', 'Рис — 100 г', 'Лук — 1 шт', 'Морковь — 1 шт', 'Томатная паста — 2 ст.л.', 'Сметана'], steps: [
                'ШАГ 1: РИС. Отварите рис до полуготовности (10 минут).',
                'ШАГ 2: КАПУСТА. Капусту нашинкуйте мелко. Обдайте кипятком, чтобы стала мягче.',
                'ШАГ 3: ФАРШ. Смешайте фарш, рис, капусту, мелко рубленый лук, соль, перец. Сформируйте котлеты.',
                'ШАГ 4: ОБЖАРКА. Обжарьте голубцы на сковороде до корочки с двух сторон.',
                'ШАГ 5: ТУШЕНИЕ. Сложите в кастрюлю, залейте соусом (томатная паста+сметана+вода). Тушите 30 минут.'
            ] },
            { id: 91, title: 'Фалафель', category: 'food', time: '40 минут (+ замачивание)', image: 'https://avatars.mds.yandex.net/i?id=1d62369329e6bcb084ccefe62e7ed2d276717799-9837641-images-thumbs&n=13', ingredients: ['Нут сухой — 250 г', 'Лук — 1 шт', 'Чеснок — 3 зубчика', 'Петрушка', 'Кинза', 'Кумин, кориандр', 'Сода'], steps: [
                'ШАГ 1: ЗАМАЧИВАНИЕ. Замочите нут в холодной воде на ночь (минимум 12 часов). Важно: не варить!',
                'ШАГ 2: ИЗМЕЛЬЧЕНИЕ. Слейте воду. Пропустите нут через мясорубку или измельчите в блендере с луком, чесноком и зеленью. Не делайте пюре, должны оставаться крупинки.',
                'ШАГ 3: СПЕЦИИ. Добавьте соль, перец, кумин, кориандр, щепотку соды. Перемешайте. Дайте постоять 15 минут.',
                'ШАГ 4: ФОРМОВКА. Мокрыми руками сформируйте шарики размером с грецкий орех.',
                'ШАГ 5: ЖАРКА. Разогрейте масло для фритюра. Жарьте фалафель порциями 3-4 минуты до золота. Выкладывайте на бумажное полотенце.'
            ] },
            { id: 92, title: 'Хумус', category: 'food', time: '15 минут', image: 'https://avatars.mds.yandex.net/i?id=8ef10689538b7a25e2049ea8e7202552ebdbe5bc-5426889-images-thumbs&n=13', ingredients: ['Нут консервированный — 400 г', 'Тхина (кунжутная паста) — 3 ст.л.', 'Чеснок — 2 зубчика', 'Лимонный сок — 3 ст.л.', 'Кумин', 'Оливковое масло'], steps: [
                'ШАГ 1: НУТ. Слейте жидкость из банки нута, но сохраните ее. Промойте нут холодной водой.',
                'ШАГ 2: ПЮРИРОВАНИЕ. В блендере смешайте нут, тхину, чеснок, лимонный сок, кумин, соль. Начните взбивать, добавляя понемногу жидкость от нута.',
                'ШАГ 3: КОНСИСТЕНЦИЯ. Добейтесь кремовой, гладкой текстуры. Хумус не должен быть густым, должен легко мазаться.',
                'ШАГ 4: ПОДАЧА. Выложите в тарелку, сделайте ложкой углубление, налейте оливковое масло. Посыпьте паприкой.',
                'ШАГ 5: ХРАНЕНИЕ. Храните в холодильнике до 5 дней.'
            ] },
            { id: 93, title: 'Ризотто с грибами', category: 'food', time: '40 минут', image: 'https://avatars.mds.yandex.net/i?id=7f2c343aad6cbfb092db6282387d666c784b0d84-4872489-images-thumbs&n=13', ingredients: ['Рис арборио — 300 г', 'Шампиньоны — 300 г', 'Лук — 1 шт', 'Бульон (овощной/куриный) — 1 л', 'Пармезан — 50 г', 'Масло сливочное', 'Вино белое — 100 мл'], steps: [
                'ШАГ 1: ГРИБЫ. Грибы нарежьте, обжарьте на масле до золота, уберите из сковороды.',
                'ШАГ 2: ЛУК. В той же сковороде обжарьте мелко рубленый лук до прозрачности.',
                'ШАГ 3: РИС. Добавьте рис, обжаривайте 2 минуты, пока края не станут прозрачными. Влейте вино, мешайте, пока не выпарится.',
                'ШАГ 4: БУЛЬОН. Добавляйте бульон по половнику, постоянно помешивая. Каждый следующий половник, когда предыдущий впитался. Через 15 минут верните грибы.',
                'ШАГ 5: МАНТЕКАТУРА. Через 20 минут (рис должен быть аль денте) снимите с огня. Добавьте масло и тертый пармезан, энергично перемешайте. Дайте постоять 2 минуты.'
            ] },
            { id: 94, title: 'Том Ям (тайский суп)', category: 'food', time: '45 минут', image: 'https://avatars.mds.yandex.net/i?id=1ba8967e0f5443ce2065e067c89b063fb4b44738-12912407-images-thumbs&n=13', ingredients: ['Креветки — 300 г', 'Кокосовое молоко — 200 мл', 'Шампиньоны — 200 г', 'Лемонграсс — 2 стебля', 'Корень галангала — 3 см', 'Листья лайма — 4 шт', 'Перец чили', 'Паста том ям', 'Рыбный соус', 'Лайм'], steps: [
                'ШАГ 1: БУЛЬОН. В кастрюлю налейте воду (1 л). Добавьте лемонграсс (раздавите), галангал (нарезанный), листья лайма, чили. Варите 15 минут.',
                'ШАГ 2: ГРИБЫ. Процедите бульон, верните на огонь. Добавьте нарезанные грибы, варите 5 минут.',
                'ШАГ 3: ПАСТА. Добавьте пасту том ям (1-2 ст.л.) и рыбный соус (2 ст.л.).',
                'ШАГ 4: КРЕВЕТКИ. Положите очищенные креветки, варите 3 минуты до готовности.',
                'ШАГ 5: КОКОС. Влейте кокосовое молоко, доведите до кипения и выключите. Добавьте сок лайма. Подавайте с рисом.'
            ] },
            { id: 95, title: 'Фо Бо (вьетнамский суп)', category: 'food', time: '90 минут', image: 'https://avatars.mds.yandex.net/i?id=1d553d28c51e35a016733efc20b919566053fcbd-8497453-images-thumbs&n=13', ingredients: ['Говядина (грудинка) — 500 г', 'Рисовая лапша — 200 г', 'Лук — 1 шт', 'Имбирь — 5 см', 'Звездчатый анис — 2 шт', 'Корица — 1 палочка', 'Рыбный соус', 'Зелень (кинза, тайский базилик)', 'Лайм', 'Перец чили'], steps: [
                'ШАГ 1: БУЛЬОН. Говядину залейте холодной водой (2 л), доведите до кипения, слейте первый бульон (он мутный). Налейте чистую воду, добавьте лук и имбирь, которые предварительно обожгите на сухой сковороде до черноты — это дает характерный копченый вкус. Добавьте анис и корицу. Варите на минимальном огне 1.5 часа, снимая пену. Бульон должен оставаться прозрачным.',
                'ШАГ 2: ПРОЦЕЖИВАНИЕ. Готовый бульон процедите через марлю или мелкое сито. Мясо достаньте, нарежьте тонкими ломтиками. Бульон приправьте рыбным соусом (2-3 ст.л.) и щепоткой сахара — это баланс вкуса.',
                'ШАГ 3: ЛАПША. Отварите рисовую лапшу согласно инструкции (обычно 3-5 минут). Не переварите, она должна быть мягкой, но упругой. Промойте холодной водой, чтобы остановить варку.',
                'ШАГ 4: СБОРКА. В глубокую тарелку положите лапшу, сверху ломтики мяса, залейте кипящим бульоном. Мясо сразу дойдет до готовности.',
                'ШАГ 5: ПОДАЧА. Отдельно подайте тарелку с зеленью (кинза, базилик, мята), ростками сои, перцем чили и дольками лайма. Каждый добавляет зелень в тарелку по вкусу и выдавливает лайм прямо в суп.'
            ] },
            { id: 96, title: 'Рататуй', category: 'food', time: '50 минут', image: 'https://avatars.mds.yandex.net/i?id=bbd368a4994fb3176ce8e2e7d10d20e25d70614b-5285349-images-thumbs&n=13', ingredients: ['Кабачки — 2 шт', 'Баклажаны — 2 шт', 'Помидоры — 4 шт', 'Перец болгарский — 2 шт', 'Лук — 1 шт', 'Чеснок — 3 зубчика', 'Тимьян', 'Оливковое масло'], steps: [
                'ШАГ 1: СОУС. Лук и перец нарежьте мелким кубиком, обжарьте на оливковом масле до мягкости. Добавьте 2 помидора (натертых на терке), чеснок, тимьян, соль, перец. Тушите 10 минут до загустения. Протрите через сито, если хотите гладкий соус.',
                'ШАГ 2: ОВОЩИ. Кабачки, баклажаны и оставшиеся 2 помидора нарежьте тонкими кружками (2-3 мм). Важно, чтобы все было одинаковой толщины.',
                'ШАГ 3: СБОРКА. В форму для запекания вылейте соус, разровняйте. По спирали или рядами выложите овощи, чередуя: кабачок, баклажан, помидор. Плотно друг к другу.',
                'ШАГ 4: ЗАПЕКАНИЕ. Сбрызните овощи маслом, посолите, поперчите, посыпьте тимьяном. Накройте пергаментом (бумага для выпечки), запекайте 40 минут при 160°C.',
                'ШАГ 5: ПОДАЧА. Подавайте горячим или теплым. Можно посыпать свежей зеленью. Это блюдо из фильма "Рататуй" — тот самый, что пробуждает воспоминания.'
            ] },
            { id: 97, title: 'Киш с брокколи (открытый пирог)', category: 'food', time: '45 минут', image: 'https://avatars.mds.yandex.net/i?id=1e695799d7d93408f86b47eda3e8b4eee8e7ae60-13273715-images-thumbs&n=13', ingredients: ['Тесто слоеное или песочное — 250 г', 'Брокколи — 400 г', 'Яйца — 3 шт', 'Сливки 20% — 200 мл', 'Сыр — 100 г', 'Чеснок — 1 зубчик', 'Мускатный орех'], steps: [
                'ШАГ 1: ОСНОВА. Раскатайте тесто, выложите в форму (диаметр 24 см), сформируйте бортики. Наколите вилкой, чтобы не вздувалось. Уберите в холодильник на 15 минут.',
                'ШАГ 2: БЛАНШИРОВКА. Брокколи разберите на соцветия. Бланшируйте в кипящей подсоленной воде 3 минуты, затем сразу в ледяную воду (чтобы сохранить цвет). Откиньте на дуршлаг.',
                'ШАГ 3: ЗАЛИВКА. В миске взбейте яйца со сливками, солью, перцем, тертым чесноком и щепоткой мускатного ореха. Добавьте половину тертого сыра.',
                'ШАГ 4: СБОРКА. На тесто выложите брокколи, залейте яичной смесью. Посыпьте оставшимся сыром.',
                'ШАГ 5: ВЫПЕКАНИЕ. Выпекайте 30-35 минут при 180°C до золотистого цвета. Дайте постоять 10 минут перед подачей.'
            ] },
            { id: 98, title: 'Картофель по-деревенски', category: 'food', time: '40 минут', image: 'https://avatars.mds.yandex.net/i?id=5c2267ccb5aefa5986525ff109c58272309670f6-11401793-images-thumbs&n=13', ingredients: ['Картофель — 1 кг (молодой лучше)', 'Масло растительное', 'Чеснок — 3 зубчика', 'Паприка копченая', 'Розмарин', 'Соль, перец'], steps: [
                'ШАГ 1: КАРТОФЕЛЬ. Тщательно вымойте картофель, особенно если молодой. Можно не чистить, кожура дает хруст. Нарежьте дольками (каждую картофелину на 6-8 частей).',
                'ШАГ 2: БЛАНШИРОВКА. Положите картофель в холодную воду, доведите до кипения, варите 5 минут. Это сделает его мягким внутри и хрустящим снаружи. Слейте воду, обсушите.',
                'ШАГ 3: ПРИПРАВЫ. В миске смешайте масло, пропущенный через пресс чеснок, паприку, розмарин, соль, перец. Залейте картофель, тщательно перемешайте.',
                'ШАГ 4: ЗАПЕКАНИЕ. Выложите картофель на противень в один слой (не наваливайте кучкой). Запекайте 30 минут при 200°C, перевернув один раз.',
                'ШАГ 5: ПОДАЧА. Подавайте горячим, посыпав свежей зеленью. Отлично с соусом — сметана+чеснок или кетчуп.'
            ] },
            { id: 99, title: 'Спагетти Болоньезе', category: 'food', time: '45 минут', image: 'https://avatars.mds.yandex.net/i?id=be8fee06e3777268f35021c363997f4153cc51ee-6416987-images-thumbs&n=13', ingredients: ['Спагетти — 300 г', 'Фарш (говядина+свинина) — 400 г', 'Лук — 1 шт', 'Морковь — 1 шт', 'Сельдерей — 1 стебель', 'Томаты в собственном соку — 400 г', 'Красное вино — 100 мл', 'Томатная паста'], steps: [
                'ШАГ 1: СОФФРИТО. Лук, морковь и сельдерей нарежьте очень мелким кубиком (это называется соффрито). Обжаривайте на оливковом масле 10 минут до мягкости.',
                'ШАГ 2: ФАРШ. Добавьте фарш, разбивая комочки лопаткой. Жарьте, пока мясо не поменяет цвет. Посолите, поперчите.',
                'ШАГ 3: ВИНО. Влейте вино, выпаривайте алкоголь 2 минуты.',
                'ШАГ 4: ТОМАТЫ. Добавьте томаты (раздавите ложкой) и томатную пасту (1 ст.л.). Тушите на маленьком огне под крышкой 30 минут. В конце добавьте немного молока или сливок — это уберет кислоту.',
                'ШАГ 5: ПАСТА. Отварите спагетти до аль денте. Смешайте с соусом, подавайте с тертым пармезаном.'
            ] },
            { id: 100, title: 'Лапша Wok с курицей', category: 'food', time: '25 минут', image: 'https://avatars.mds.yandex.net/i?id=eab4299842be5d37767c5c2ed205e0e7ba26d816221f4a83-13202504-images-thumbs&n=13', ingredients: ['Лапша (удон или яичная) — 200 г', 'Куриное филе — 300 г', 'Перец болгарский — 1 шт', 'Морковь — 1 шт', 'Лук — 1 шт', 'Соевый соус', 'Устричный соус', 'Кунжутное масло', 'Чеснок', 'Имбирь'], steps: [
                'ШАГ 1: ПОДГОТОВКА. Курицу нарежьте тонкими полосками. Овощи тоже нарежьте соломкой (морковь, перец, лук). Чеснок и имбирь мелко порубите.',
                'ШАГ 2: ЛАПША. Отварите лапшу согласно инструкции, промойте холодной водой, сбрызните кунжутным маслом, чтобы не слиплась.',
                'ШАГ 3: ВОК. Сильно разогрейте вок или большую сковороду с маслом. Бросайте ингредиенты по очереди: сначала имбирь и чеснок (10 сек), затем курицу (жарьте 2 минуты, постоянно помешивая), затем овощи (жарьте еще 2 минуты). Огонь должен быть максимальным.',
                'ШАГ 4: СОУС. Добавьте лапшу, соевый соус (2 ст.л.), устричный соус (1 ст.л.), щепотку сахара. Перемешивайте, подбрасывая, 1 минуту.',
                'ШАГ 5: ПОДАЧА. Посыпьте кунжутом и зеленым луком. Подавайте сразу.'
            ] },
            { id: 101, title: 'Сэндвич с тунцом', category: 'food', time: '15 минут', image: 'https://avatars.mds.yandex.net/i?id=85df5327c120dd9dfdc24284b4ae8c6d7735d4b5-10952687-images-thumbs&n=13', ingredients: ['Хлеб для тостов — 2 куска', 'Тунец консервированный — 1 банка', 'Майонез — 1 ст.л.', 'Красный лук — 0.5 шт', 'Корнишоны — 3 шт', 'Салат', 'Помидор'], steps: [
                'ШАГ 1: ТУНЕЦ. Слейте жидкость из банки. Разомните тунца вилкой в миске.',

            { id: 103, title: 'Чизкейк Нью-Йорк', category: 'food', time: '90 минут + охлаждение', image: 'https://avatars.mds.yandex.net/i?id=7de0f4c0056e1d937b68a8179ee0b104238d1ec3-5031277-images-thumbs&n=13', ingredients: ['Печенье (Юбилейное) — 300 г', 'Масло сливочное — 100 г', 'Сливочный сыр (Филадельфия) — 900 г', 'Сахар — 200 г', 'Яйца — 3 шт', 'Сливки 33% — 100 мл', 'Ваниль', 'Лимонный сок'], steps: [

                'ШАГ 3: ФОРМА. Оберните форму снаружи фольгой в 2 слоя (водяная баня). Вылейте начинку на корж.',

                'ШАГ 5: ОХЛАЖДЕНИЕ. Выключите духовку, приоткройте дверцу, оставьте чизкейк там на 1 час. Затем достаньте, остудите до комнатной температуры. Уберите в холодильник минимум на 6 часов, лучше на ночь.'
            ] },
            { id: 104, title: 'Панкейки (американские блинчики)', category: 'food', time: '20 минут', image: 'https://avatars.mds.yandex.net/i?id=c61e92e543a778d0444b4c80cdf2430e5bcefba1-5306229-images-thumbs&n=13', ingredients: ['Мука — 200 г', 'Молоко — 250 мл', 'Яйцо — 1 шт', 'Сахар — 2 ст.л.', 'Разрыхлитель — 2 ч.л.', 'Соль — щепотка', 'Масло растительное — 2 ст.л.'], steps: [
                'ШАГ 1: СУХИЕ. В одной миске смешайте муку, разрыхлитель, сахар, соль.',

                'ШАГ 3: СМЕШИВАНИЕ. Влейте жидкие в сухие, быстро перемешайте венчиком. Не старайтесь разбить все комочки — если мешать долго, панкейки будут резиновыми. Дайте тесту постоять 5 минут.',

                'ШАГ 1: ЯБЛОКИ. Яблоки очистите от кожуры, удалите сердцевину. Нарежьте кубиками или дольками. Посыпьте корицей, можно сбрызнуть лимонным соком.',
                'ШАГ 2: ТЕСТО. Яйца с сахаром взбивайте миксером 5-7 минут до пышной светлой массы. Масса должна увеличиться в 2-3 раза. Это важно, чтобы шарлотка поднялась.',
                'ШАГ 3: МУКА. Просейте муку с разрыхлителем в яичную массу. Аккуратно перемешайте лопаткой снизу вверх, чтобы не осадить пену.',
                'ШАГ 4: СБОРКА. Форму смажьте маслом, присыпьте мукой. Выложите яблоки, залейте тестом. Слегка постучите формой, чтобы тесто распределилось.',

            ] },
            { id: 106, title: 'Брауни', category: 'food', time: '35 минут', image: 'https://avatars.mds.yandex.net/i?id=019f6758397a7f184a441cfde988aafc9f9ffeeb-10351804-images-thumbs&n=13', ingredients: ['Темный шоколад (70%) — 200 г', 'Сливочное масло — 150 г', 'Сахар — 200 г', 'Яйца — 3 шт', 'Мука — 100 г', 'Какао — 2 ст.л.', 'Соль — щепотка'], steps: [
                'ШАГ 1: ШОКОЛАД. Поломайте шоколад в миску, добавьте масло. Растопите на водяной бане или в микроволновке короткими импульсами. Перемешайте до гладкости. Остудите до теплого.',
                'ШАГ 2: ЯЙЦА. В другой миске взбейте яйца с сахаром до светлой пены. Не нужно взбивать до жестких пиков, просто до растворения сахара.',
                'ШАГ 3: СМЕШИВАНИЕ. Влейте шоколадную массу в яйца, перемешайте. Просейте муку, какао и соль, аккуратно вмешайте лопаткой. Не мешайте долго.',
                'ШАГ 4: ФОРМА. Застелите форму (20х20 см) пергаментом. Вылейте тесто, разровняйте.',
                'ШАГ 5: ВЫПЕКАНИЕ. Выпекайте 20-25 минут при 180°C. Важно: брауни должен остаться влажным внутри. Палочка должна выходить с влажными крошками, не сухая. Полностью остудите в форме, только потом нарезайте.'
            ] }
        ];

        const allRecipes = [...coffeeRecipes, ...teaRecipes, ...foodRecipes];

        let favorites = [];
        try { favorites = JSON.parse(localStorage.getItem('favorites')) || []; } catch(e) {}

        let currentPage = 'home';
        let currentFilter = 'all';
        let searchQuery = '';

        const main = document.getElementById('main-content');

        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
            const icon = document.querySelector('.mobile-menu-toggle i');
            icon.className = menu.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
        };

        window.navigateTo = function(page) {
            currentPage = page;
            if (page === 'home')          renderHome();
            else if (page === 'coffee')   { currentFilter = 'coffee'; searchQuery = ''; renderRecipes(); }
            else if (page === 'tea')      { currentFilter = 'tea';    searchQuery = ''; renderRecipes(); }
            else if (page === 'food')     { currentFilter = 'food';   searchQuery = ''; renderRecipes(); }
            else if (page === 'favorites') renderFavorites();
            else if (page === 'contacts')  renderContacts();

            const menu = document.getElementById('mobileMenu');
            menu.classList.remove('active');
            document.querySelector('.mobile-menu-toggle i').className = 'fas fa-bars';
        };

        function renderHome() {
            main.innerHTML = `
                <section class="hero">
                    <div class="container hero-container">
                        <div class="hero-content">
                            <h1 class="hero-title"><span>Nortix</span> - 106 подробных рецептов</h1>
                            <p class="hero-text">Кофе, чай и еда с пошаговыми инструкциями. Каждый рецепт проверен и описан до мелочей.</p>
                            <div class="hero-buttons">
                                <button class="btn" onclick="navigateTo('coffee')">Кофе (${coffeeRecipes.length})</button>
                                <button class="btn btn-outline" onclick="navigateTo('tea')">Чай (${teaRecipes.length})</button>
                                <button class="btn btn-outline" onclick="navigateTo('food')">Еда (${foodRecipes.length})</button>
                            </div>
                        </div>
                        <div class="hero-image">
                            <img src="https://avatars.mds.yandex.net/i?id=353766b95ca7150d6720ecbf7c90596f0bd421d4-12598198-images-thumbs&n=13" alt="Coffee" loading="lazy">
                        </div>
                    </div>
                </section>
                <section class="stats">
                    <div class="container stats-grid">
                        <div class="stat-item"><div class="stat-number">${coffeeRecipes.length}</div><div>рецептов кофе</div></div>
                        <div class="stat-item"><div class="stat-number">${teaRecipes.length}</div><div>рецептов чая</div></div>
                        <div class="stat-item"><div class="stat-number">${foodRecipes.length}</div><div>рецептов еды</div></div>
                        <div class="stat-item"><div class="stat-number">${favorites.length}</div><div>в избранном</div></div>
                    </div>
                </section>
                <section>
                    <div class="container">
                        <h2 style="margin: 30px 0; text-align: center; font-size: 24px;">Популярные рецепты</h2>
                        <div class="recipes-grid">${allRecipes.slice(0,6).map(r => card(r)).join('')}</div>
                    </div>
                </section>`;
            favListeners();
        }

        function renderFavorites() {
            const list = allRecipes.filter(r => favorites.includes(r.id));
            main.innerHTML = `
                <section class="favorites-header">
                    <div class="container">
                        <h2>Избранное</h2>
                        <p>${list.length} рецептов в избранном</p>
                    </div>
                </section>
                <section>
                    <div class="container">
                        <div class="recipes-grid">
                            ${list.length > 0
                                ? list.map(r => card(r)).join('')
                                : '<p style="text-align:center;color:var(--text-secondary);padding:40px;">У вас пока нет избранных рецептов</p>'}
                        </div>
                    </div>
                </section>`;
            favListeners();
        }

        function getFiltered() {
            let list = currentFilter === 'all' ? allRecipes : allRecipes.filter(r => r.category === currentFilter);
            const q = searchQuery.trim().toLowerCase();
            if (q) list = list.filter(r => r.title.toLowerCase().includes(q));
            return list;
        }

        function renderRecipes() {
            const filtered = getFiltered();
            const catName = { coffee:'Кофе', tea:'Чай', food:'Еда', all:'Все рецепты' }[currentFilter];

            main.innerHTML = `
                <section class="search-section">
                    <div class="container">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Поиск рецептов..." autocomplete="off">
                        </div>
                        <div class="filter-buttons">
                            <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">Все</button>
                            <button class="filter-btn ${currentFilter==='coffee'?'active':''}" onclick="setFilter('coffee')">Кофе</button>
                            <button class="filter-btn ${currentFilter==='tea'?'active':''}" onclick="setFilter('tea')">Чай</button>
                            <button class="filter-btn ${currentFilter==='food'?'active':''}" onclick="setFilter('food')">Еда</button>
                        </div>
                    </div>
                </section>
                <section>
                    <div class="container">
                        <h2 id="resultsTitle" style="margin:20px 0;font-size:20px;">${catName} (${filtered.length})</h2>
                        <div class="recipes-grid" id="recipesGrid">
                            ${renderCards(filtered)}
                        </div>
                    </div>
                </section>`;

            const input = document.getElementById('searchInput');
            input.value = searchQuery;
            input.addEventListener('input', function() {
                searchQuery = this.value;
                refreshGrid();
            });

            favListeners();
        }

        function refreshGrid() {
            const filtered = getFiltered();
            const catName = { coffee:'Кофе', tea:'Чай', food:'Еда', all:'Все рецепты' }[currentFilter];

            const title = document.getElementById('resultsTitle');
            if (title) title.textContent = `${catName} (${filtered.length})`;

            const grid = document.getElementById('recipesGrid');
            if (grid) {
                grid.innerHTML = renderCards(filtered);
                favListeners();
            }
        }

        function renderCards(list) {
            return list.length > 0
                ? list.map(r => card(r)).join('')
                : '<p style="text-align:center;color:var(--text-secondary);padding:40px;">Ничего не найдено</p>';
        }

        window.setFilter = function(filter) {
            currentFilter = filter;
            renderRecipes();
        };

        function card(recipe) {
            const isFav = favorites.includes(recipe.id);
            const catNames = { coffee:'Кофе', tea:'Чай', food:'Еда' };
            return `
                <div class="recipe-card" onclick="viewRecipe(${recipe.id})">
                    <div class="recipe-image">
                        <img src="${recipe.image}" alt="${recipe.title}" loading="lazy">
                    </div>
                    <div class="recipe-content">
                        <div class="recipe-title">
                            <h3>${recipe.title}</h3>
                            <span class="recipe-category">${catNames[recipe.category]}</span>
                        </div>
                        <div class="recipe-time"><i class="far fa-clock"></i> ${recipe.time}</div>
                        <div class="recipe-ingredients">
                            <h4>Ингредиенты:</h4>
                            <ul>${recipe.ingredients.slice(0,3).map(i => `<li>${i.split(' — ')[0]}</li>`).join('')}</ul>
                        </div>
                        <div class="recipe-footer">
                            <button class="favorite-btn" data-id="${recipe.id}" onclick="event.stopPropagation();toggleFav(${recipe.id})">
                                <i class="${isFav?'fas':'far'} fa-heart"></i>
                            </button>
                            <button class="btn" style="padding:8px 16px;" onclick="event.stopPropagation();viewRecipe(${recipe.id})">Смотреть</button>
                        </div>
                    </div>
                </div>`;
        }

        window.viewRecipe = function(id) {
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            const isFav = favorites.includes(id);
            const catNames = { coffee:'Кофе', tea:'Чай', food:'Еда' };

            main.innerHTML = `
                <section class="single-recipe">
                    <div class="container">
                        <button class="back-btn" onclick="navigateTo('${recipe.category}')">
                            <i class="fas fa-arrow-left"></i> Назад к рецептам
                        </button>
                        <div class="single-recipe-container">
                            <div class="single-recipe-image">
                                <img src="${recipe.image}" alt="${recipe.title}" loading="lazy">
                            </div>
                            <div class="single-recipe-content">
                                <h1>${recipe.title}</h1>
                                <div class="single-recipe-meta">
                                    <span><i class="far fa-clock"></i> ${recipe.time}</span>
                                    <span><i class="fas fa-tag"></i> ${catNames[recipe.category]}</span>
                                </div>
                                <div class="single-recipe-ingredients">
                                    <h2>Ингредиенты</h2>
                                    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                                </div>
                                <div class="single-recipe-steps">
                                    <h2>Пошаговое приготовление</h2>
                                    <ol>${recipe.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                                </div>
                                <button class="btn" style="margin-top:20px;width:100%;" onclick="toggleFav(${id})">
                                    <i class="${isFav?'fas':'far'} fa-heart"></i>
                                    ${isFav ? 'В избранном' : 'Добавить в избранное'}
                                </button>
                            </div>
                        </div>
                    </div>
                </section>`;
        };

        function renderContacts() {
            main.innerHTML = `
                <section class="contacts-page">
                    <div class="container">
                        <div class="contacts-card">
                            <div class="contacts-icon">
                                <i class="fas fa-envelope-open-text"></i>
                            </div>
                            <h2>Свяжитесь с нами</h2>
                            <p>Нашли ошибку или есть предложение?</p>
                            <p>Напишите нам на почту:</p>
                            <div class="contacts-email">
                                <i class="far fa-envelope" style="margin-right: 10px;"></i>
                                nortix.coffee@gmail.com
                            </div>
                            <p class="contacts-note">Мы отвечаем в течение 48 часов</p>
                        </div>
                    </div>
                </section>`;
        }

        window.toggleFav = function(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('favorites', JSON.stringify(favorites));

            if (document.querySelector('.single-recipe')) {
                viewRecipe(id);
            } else if (currentPage === 'home') {
                renderHome();
            } else if (currentPage === 'favorites') {
                renderFavorites();
            } else {
                refreshGrid();
            }
        };

        function favListeners() {
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFav(parseInt(btn.dataset.id));
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderHome();
            showCookieConsent();
            
            const yearElement = document.querySelector('.footer p');
            if (yearElement) {
                const currentYear = new Date().getFullYear();
                yearElement.innerHTML = `© ${currentYear} Nortix кофе, чай и еда`;
            }
        });
    </script>
</body>
</html>
